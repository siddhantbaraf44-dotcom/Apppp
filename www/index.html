<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Shelf">
<title>Shelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232b50ff'/%3E%3Cpath d='M12 8.5v9l8-4.5z' fill='%23fff'/%3E%3Crect x='7' y='22' width='18' height='3' rx='1.5' fill='%23ffb400'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--card:#111;--ink:#f2f2f2;--mute:#8b8b8b;--line:#262626;
  --acc:#7b93ff;--on-acc:#000;--acc-soft:#1c2340;--hot:#ffc233;--on-hot:#000;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:400 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(88px + env(safe-area-inset-bottom));min-height:100vh}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.6;cursor:default}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}

/* icons */
.i{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.f{fill:currentColor;stroke:none}
.i.s{width:15px;height:15px}
.i.l{width:30px;height:30px}

.view{display:none;max-width:760px;margin:0 auto}
.view.on{display:block}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:800;letter-spacing:-.02em;margin:18px 0 10px}
.ghost{color:var(--mute);padding:6px;border-radius:50%}
.sub{color:var(--mute);font-size:14px}
.err{color:#ff6b6b;margin:10px 0}
.empty{color:var(--mute);padding:24px 4px}

/* forms */
form.bar{display:flex;gap:8px;margin:6px 0 14px}
.field{position:relative;flex:1;min-width:0}
.field>.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
input[type=search],input[type=text]{width:100%;padding:13px 14px 13px 42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
input:focus{border-color:var(--acc);outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;min-width:48px;border-radius:12px;background:var(--acc);color:var(--on-acc);font-weight:600;position:relative}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.more{display:flex;width:100%;padding:14px;margin:16px 0}
#fcnt{position:absolute;top:-6px;right:-6px;min-width:18px;line-height:18px;border-radius:99px;background:var(--hot);color:var(--on-hot);font-size:11px;text-align:center;font-weight:800}

/* suggestions */
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:8;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.7)}
.sg{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg .i{color:var(--mute)}

/* filter panel */
#fpanel{background:var(--card);border-radius:16px;padding:12px 12px 2px;margin:-4px 0 14px}
.fg{margin-bottom:12px}
.fg h4{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.fg div{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:7px 13px;border-radius:99px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.fchip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

/* chips / strips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--acc);color:var(--acc);font-size:13px;font-weight:600}
.chip.on{background:var(--hot);border-color:var(--hot);color:var(--on-hot)}
.chip.q{border-color:var(--line);color:var(--ink);background:var(--card);font-size:14px;padding:8px 14px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:800;font-size:22px;overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.story{position:relative;flex:0 0 auto;width:72px;text-align:center;font-size:12px}
.story .av{margin:0 auto 6px}
.story span.n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{position:absolute;top:-2px;right:4px;min-width:20px;line-height:20px;border-radius:99px;background:var(--hot);color:var(--on-hot);font-size:11px;font-weight:800;border:2px solid var(--bg)}
.ch{flex:0 0 auto;width:132px;background:var(--card);border-radius:14px;padding:12px;text-align:center}
.ch .av{margin:0 auto 8px}
.ch b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.2;margin-bottom:8px}
.hc{flex:0 0 auto;width:150px;text-align:left}
.hc .t{position:relative;display:block;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--line)}
.hc img{width:100%;height:100%;object-fit:cover;display:block}
.hc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:600;line-height:1.25;margin-top:6px}

/* video grid */
.vlist{display:grid;gap:20px}
@media(min-width:620px){.vlist{grid-template-columns:1fr 1fr}}
.v .thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--line)}
.v img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;padding:2px 6px;border-radius:5px}
.newtag{position:absolute;left:6px;top:6px;background:var(--hot);color:var(--on-hot);font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px}
.pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:0;background:rgba(0,0,0,.25)}
.thumb:active .pl{opacity:1}
.meta{padding:8px 2px 0}
.meta h3{font-size:15px;font-weight:600;line-height:1.25;margin-bottom:4px}
.facts{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mute);font-size:13px;margin-bottom:8px}

/* rows */
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.row .av{width:46px;height:46px;font-size:18px}
.row .open{flex:1;min-width:0;text-align:left}
.row .open b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .del{color:var(--mute);padding:10px;border-radius:50%}
.row .pt{position:relative;flex:0 0 74px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line)}
.row .pt img{width:100%;height:100%;object-fit:cover;display:block}
.newchip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:var(--hot);color:var(--on-hot);font-size:11px;font-weight:800;vertical-align:middle}
.back{display:inline-flex;align-items:center;gap:6px;margin:4px 0 8px;color:var(--acc);font-weight:600;padding:6px 0}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.fhead h2{font-weight:800;letter-spacing:-.02em;font-size:22px}
.hero{background:var(--card);border-radius:20px;padding:22px 18px;text-align:center;margin-top:14px}
.hero h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.hero p{color:var(--mute);margin-bottom:14px}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* skeleton */
.sk{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%}
.skr{height:74px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%}
@media(prefers-reduced-motion:no-preference){.sk,.skr{animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);position:relative}
nav .pill{display:grid;place-items:center;padding:4px 20px;border-radius:99px;position:relative}
nav button[aria-selected=true]{color:var(--acc)}
nav button[aria-selected=true] .pill{background:var(--acc-soft)}
#count{position:absolute;top:-2px;right:6px;min-width:18px;padding:0 5px;border-radius:99px;background:var(--hot);color:var(--on-hot);font-size:11px;line-height:18px}

/* watch page */
#watch{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:var(--bg)}
#watch.on{display:flex}
.pwrap{position:relative;background:#000;padding-top:env(safe-area-inset-top)}
.wtop{position:relative;touch-action:none;display:flex;align-items:center;gap:4px;height:44px;padding:0 6px;color:#fff;max-width:960px;margin:0 auto}
.grab{position:absolute;left:50%;top:7px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:rgba(255,255,255,.35)}
.wtop button{color:#fff;padding:8px;border-radius:50%}
.wtop span{font-size:14px;opacity:.8}
#pframe{aspect-ratio:16/9;width:100%;max-width:960px;margin:0 auto;background:#000}
#pframe iframe{width:100%;height:100%;border:0;display:block}
#wbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:100%;max-width:960px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
#wtitle{font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.02em;margin-bottom:4px}
#wmeta{margin-bottom:12px}
.wch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wch .av{width:42px;height:42px;font-size:17px}
.wn{flex:1;min-width:0;text-align:left}
.wn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.votes{display:flex;align-items:center;gap:14px;margin-bottom:10px;color:var(--mute);font-size:14px;min-height:0}
.votes span{display:inline-flex;align-items:center;gap:6px}
.rbar{width:70px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--acc)}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.tools a{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:none}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;margin:0;padding:0;border:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--acc)}
.sw input:checked::after{transform:translateX(17px)}
.desc{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 10px;font-size:14px}
#wdtext{white-space:pre-wrap;word-break:break-word}
#wdtext.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#wdmore{color:var(--acc);font-weight:600;font-size:14px;margin-top:8px}
.chaps{max-height:232px;overflow-y:auto;background:var(--card);border-radius:14px;padding:4px 6px;margin-bottom:10px}
.chp{display:flex;gap:12px;width:100%;text-align:left;padding:9px 8px;border-radius:10px;font-size:14px}
.chp:active{background:var(--acc-soft)}
.chp .ts{color:var(--acc);font-weight:600;min-width:54px}
.cbtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border-radius:14px;padding:13px 14px;font-weight:600;margin:0 0 6px}
.cbtn .sp{flex:1;text-align:left}
.cbtn.open>.i:last-child{transform:rotate(180deg)}
.cm{display:flex;gap:10px;padding:10px 0}
.cm .av{width:34px;height:34px;font-size:14px}
.cm .cb{flex:1;min-width:0}
.cm p{white-space:pre-wrap;word-break:break-word;font-size:14px;margin:2px 0 6px}
.cmf{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--mute);font-size:13px}
.cmf span{display:inline-flex;align-items:center;gap:5px}
.reps:not(:empty){margin-top:6px;padding-left:8px;border-left:2px solid var(--line)}
.rc{display:flex;gap:10px;width:100%;text-align:left;padding:6px;border-radius:10px}
.rc.cur{background:var(--acc-soft)}
.rc .t{position:relative;display:block;flex:0 0 42%;max-width:190px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--line)}
.rc img{width:100%;height:100%;object-fit:cover;display:block}
.rc .x{display:block;min-width:0}
.rc h4{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:600;line-height:1.25;margin-bottom:4px}
.rc .sub{display:block;font-size:12.5px}

/* mini player: same iframe, docked above the tab bar */
#minibar,#mtap{display:none}
#watch.mini{inset:auto 8px calc(72px + env(safe-area-inset-bottom)) 8px;height:64px;flex-direction:row;align-items:center;
  background:var(--card);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.55);overflow:hidden;z-index:7}
#watch.mini .pwrap{flex:0 0 114px;height:64px;padding:0}
#watch.mini .wtop,#watch.mini #wbody{display:none}
#watch.mini #pframe{width:114px;height:64px;aspect-ratio:auto;max-width:none}
#watch.mini #mtap{display:block;position:absolute;inset:0;z-index:2}
#watch.mini #minibar{display:flex;flex:1;min-width:0;align-items:center;padding-right:4px}
#minibar .mtext{flex:1;min-width:0;text-align:left;padding:0 8px 0 10px}
#minibar .mtext b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#minibar .mtext .sub{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#minibar .mb{padding:10px;border-radius:50%;color:var(--ink)}
body.hasmini{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
body.hasmini #toast{bottom:calc(160px + env(safe-area-inset-bottom))}
@media(min-width:600px){#watch.mini{left:auto;width:380px}}

/* sync sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sbox{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:18px;font-weight:800}
.code{font:600 19px/1.35 ui-monospace,Menlo,monospace;letter-spacing:.05em;word-break:break-all;background:var(--bg);padding:12px;border-radius:12px;margin:10px 0}
.srow{display:flex;gap:8px;margin-bottom:10px}
.srow .btn{flex:1;padding:12px}

/* channel tabs + shorts grid */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .fchip{flex:0 0 auto}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.scard{position:relative;display:block;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--line);text-align:left}
.scard img{width:100%;height:100%;object-fit:cover;display:block}
.scard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.scard b{position:absolute;left:8px;right:8px;bottom:22px;z-index:1;font-size:12px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .sv{position:absolute;left:8px;bottom:6px;z-index:1;font-size:11px;color:#ddd}
.livetag{position:absolute;left:6px;top:6px;background:#e5231b;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px}
.arow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.arow:last-child{border-bottom:0}
.arow b{text-align:right;font-weight:600}

/* shorts viewer (full-screen vertical feed) */
#shv{position:fixed;inset:0;z-index:12;background:#000;display:none;color:#fff}
#shv.on{display:block}
#shplayer{position:absolute;inset:0;z-index:1;background:#000}
#shplayer iframe,#shplayer #shyt{width:100%;height:100%;border:0;display:block}
#shscroll{position:absolute;inset:0;z-index:2;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#shscroll::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.slide .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transition:opacity .18s}
.slide.live .poster{opacity:0;pointer-events:none}
.slide .gr{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.78));pointer-events:none}
.slide .tap{position:absolute;inset:0;width:100%;height:100%}
.slide .info{position:absolute;left:14px;right:78px;bottom:calc(22px + env(safe-area-inset-bottom));pointer-events:none}
.slide .info button,.slide .info a{pointer-events:auto}
.irow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chn{font-weight:800;font-size:15px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.slide .info p{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.rail{position:absolute;right:10px;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.rb{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff}
.shmsg{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;text-align:center;padding:0 24px}
#shtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none}
#shtop button{pointer-events:auto;color:#fff;padding:8px;border-radius:50%}
#shtop b{font-size:18px;font-weight:800}
#shbar{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;background:rgba(255,255,255,.2)}
#shbar i{display:block;height:100%;width:0;background:#fff}
#shflash{position:absolute;left:50%;top:50%;z-index:3;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;opacity:0;pointer-events:none}
#shflash.on{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
@media(min-width:700px){#shplayer,#shscroll{left:50%;right:auto;width:min(100%,calc(100vh*9/16));transform:translateX(-50%)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<script>
const API = 'https://royal-river-0d53.tempmail99666.workers.dev';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, c = '') => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const enc = encodeURIComponent;

/* ---------- storage (localStorage with memory fallback) ---------- */
const memo = {};
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return memo[k] ?? d; } },
  set(k, v){ memo[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let saved  = store.get('shelf.channels', []);
let hist   = store.get('shelf.history', []);
let plists = store.get('shelf.playlists', []);
let seen   = store.get('shelf.seen', {});           // channelId -> ISO time of last visit
let F      = store.get('shelf.filters', { type: '', date: '', dur: '', sort: '', live: false });
const isSaved   = id => saved.some(c => c.id === id);
const isPlSaved = id => plists.some(p => p.id === id);
{ const now = new Date().toISOString(); let ch = false; saved.forEach(c => { if (!seen[c.id]) { seen[c.id] = now; ch = true; } }); if (ch) store.set('shelf.seen', seen); }

function persist(){
  store.set('shelf.channels', saved); store.set('shelf.history', hist);
  store.set('shelf.playlists', plists); store.set('shelf.seen', seen);
}
function commit(){ persist(); touch(); }

/* ---------- helpers ---------- */
const vmap = new Map(), plmap = new Map();
function remember(list){
  list.forEach(v => {
    if (!v.id) return;
    const clean = Object.fromEntries(Object.entries(v).filter(([, x]) => x));
    vmap.set(v.id, { ...(vmap.get(v.id) || {}), ...clean });
  });
}
const compact = n => new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(n || 0);
const fmtViews = n => n >= 1e6 ? (n/1e6).toFixed(1).replace('.0','')+'M views' : n >= 1e3 ? (n/1e3).toFixed(1).replace('.0','')+'K views' : n+' views';
const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
function ago(iso){
  const s = (new Date(iso) - Date.now()) / 1000;
  for (const [n, v] of [['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60]])
    if (Math.abs(s) >= v) return rtf.format(Math.round(s / v), n);
  return 'just now';
}
const norm = v => ({ ...v, views: typeof v.views === 'number' ? (v.views ? fmtViews(v.views) : '') : v.views, ago: v.published ? ago(v.published) : v.ago });
const avatar = c => `<div class="av">${c.avatar ? `<img src="${esc(c.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : esc((c.name || '?')[0].toUpperCase())}</div>`;
const skel = n => Array.from({ length: n }, () => '<div class="sk"></div>').join('');
const skelRows = n => Array.from({ length: n }, () => '<div class="skr"></div>').join('');
const chipInner = (on, label = 'Save channel') => `${ic(on ? 'check' : 'plus', 's')}<span>${on ? 'Saved' : label}</span>`;
const saveBtn = (id, name) => id ? `<button class="chip ${isSaved(id) ? 'on' : ''}" data-save="${esc(id)}" data-name="${esc(name)}">${chipInner(isSaved(id))}</button>` : '';
const plSaveBtn = id => `<button class="chip ${isPlSaved(id) ? 'on' : ''}" data-savepl="${esc(id)}">${chipInner(isPlSaved(id), 'Save playlist')}</button>`;
const linkify = s => s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const durSec = d => String(d || '').split(':').reduce((a, p) => a * 60 + (+p || 0), 0);

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1900);
}
async function api(path){
  const r = await fetch(API + path);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
const moreBtn = (id, on) => on ? `<button class="btn more" id="${id}">${ic('down')}Load more</button>` : '';

/* ---------- new-upload badges ---------- */
let homeVids = [], freshSrv = null, homeDirty = true, homeAt = 0;
const isNewVid = v => { const s = seen[v.channelId]; return !!(s && v.published && Date.parse(v.published) > Date.parse(s)); };
const fresh = id => freshSrv ? (freshSrv[id] || 0) : homeVids.filter(v => v.channelId === id && isNewVid(v)).length;
function markSeen(id){
  seen[id] = new Date().toISOString(); if (freshSrv) freshSrv[id] = 0;
  commit(); renderStories(); renderSaved();
}
/* ---------- library: channels + playlists ---------- */
function saveCh(c){
  if (!c.id || isSaved(c.id)) return;
  saved.unshift({ id: c.id, name: c.name || 'Channel', avatar: c.avatar || '' });
  seen[c.id] = new Date().toISOString();
  homeDirty = true; commit(); refresh(); toast('Channel saved');
  if (!c.avatar) fillAvatar(c.id);
}
function unsaveCh(id){
  saved = saved.filter(c => c.id !== id); delete seen[id];
  homeDirty = true; commit(); refresh(); toast('Channel removed');
}
function savePl(p){
  if (!p.id || isPlSaved(p.id)) return;
  plists.unshift({ id: p.id, title: p.title || 'Playlist', thumb: p.thumb || '', count: p.count || '', channel: p.channel || '' });
  commit(); refresh(); toast('Playlist saved');
}
function unsavePl(id){ plists = plists.filter(p => p.id !== id); commit(); refresh(); toast('Playlist removed'); }

async function fillAvatar(id){
  try {
    const d = await api('/videos?id=' + enc(id));
    const c = saved.find(c => c.id === id);
    if (c && d.avatar && !c.avatar) { c.avatar = d.avatar; if (d.name && c.name === 'Channel') c.name = d.name; commit(); refresh(); }
  } catch {}
}

function refresh(){
  const n = saved.length, el = $('#count');
  el.hidden = !n; el.textContent = n;
  document.querySelectorAll('[data-save]').forEach(b => { const on = isSaved(b.dataset.save); b.classList.toggle('on', on); b.innerHTML = chipInner(on); });
  document.querySelectorAll('[data-savepl]').forEach(b => { const on = isPlSaved(b.dataset.savepl); b.classList.toggle('on', on); b.innerHTML = chipInner(on, 'Save playlist'); });
  renderSaved();
  if ($('#home').classList.contains('on')) renderHome();
}

/* ---------- cards ---------- */
function vcard(v, chip = true, flag = false){
  const facts = [v.channel, v.views, v.ago].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');
  return `<article class="v">
    <button class="thumb" data-play="${esc(v.id)}" aria-label="Play ${esc(v.title)}">
      <img src="${esc(v.thumb)}" alt="" loading="lazy">${v.duration ? `<span class="dur">${esc(v.duration)}</span>` : ''}${v.live ? '<span class="livetag">LIVE</span>' : ''}${flag && isNewVid(v) ? '<span class="newtag">NEW</span>' : ''}
      <span class="pl">${ic('play', 'f l')}</span>
    </button>
    <div class="meta"><h3>${esc(v.title)}</h3><div class="facts">${facts}</div>${chip ? saveBtn(v.channelId, v.channel) : ''}</div>
  </article>`;
}
const rcard = (v, attr = `data-play="${esc(v.id)}"`, cls = '') => `<button class="rc ${cls}" ${attr}>
  <span class="t"><img src="${esc(v.thumb)}" alt="" loading="lazy">${v.duration ? `<span class="dur">${esc(v.duration)}</span>` : ''}</span>
  <span class="x"><h4>${esc(v.title)}</h4><span class="sub">${esc(v.channel || '')}</span><span class="sub">${esc([v.views, v.ago].filter(Boolean).join('  '))}</span></span>
</button>`;
const hcard = v => `<button class="hc" data-play="${esc(v.id)}"><span class="t"><img src="${esc(v.thumb)}" alt="" loading="lazy"></span><b>${esc(v.title)}</b></button>`;
const cnt = c => c ? esc(/video/i.test(c) ? c : c + ' videos') : '';
const plCard = p => { plmap.set(p.id, p); return `<button class="hc" data-pl="${esc(p.id)}" data-title="${esc(p.title)}"><span class="t"><img src="${esc(p.thumb)}" alt="" loading="lazy">${p.count ? `<span class="dur">${cnt(p.count)}</span>` : ''}</span><b>${esc(p.title)}</b></button>`; };
const plBig = p => { plmap.set(p.id, p); return `<article class="v">
  <button class="thumb" data-pl="${esc(p.id)}" data-title="${esc(p.title)}" aria-label="Open ${esc(p.title)}"><img src="${esc(p.thumb)}" alt="" loading="lazy">${p.count ? `<span class="dur">${cnt(p.count)}</span>` : ''}<span class="pl">${ic('list', 'l')}</span></button>
  <div class="meta"><h3>${esc(p.title)}</h3><div class="facts"><span>${esc(p.channel || '')}</span></div>${plSaveBtn(p.id)}</div></article>`; };
const chCard = c => `<div class="ch">${avatar(c)}<b>${esc(c.name)}</b>${saveBtn(c.id, c.name)}</div>`;
const chRow = c => `<div class="row">${avatar(c)}<button class="open" data-open="${esc(c.id)}" data-name="${esc(c.name)}"><b>${esc(c.name)}</b><span class="sub">${esc(c.subs || '')}</span></button>${saveBtn(c.id, c.name)}</div>`;

/* ---------- navigation ---------- */
let fromTab = 'home';
function setFrom(){
  const v = document.querySelector('.view.on')?.id;
  if (v && v !== 'feed') fromTab = v;
  $('#backl').textContent = fromTab === 'home' ? 'Home' : fromTab === 'search' ? 'Search' : 'Library';
}
function show(name){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === name));
  const tab = name === 'feed' ? 'saved' : name;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  hideSugg(); scrollTo(0, 0);
  if (name === 'home') renderHome();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  if (b.dataset.tab === 'shorts') return openShorts({ kind: 'feed' });
  if (watchOpen) history.back();
  show(b.dataset.tab);
});
$('#back').onclick = () => show(fromTab);

/* ---------- HOME ---------- */
function renderStories(){
  $('#hchan').innerHTML = saved.length
    ? `<div class="strip">${saved.map(c => { const n = fresh(c.id); return `<button class="story" data-open="${esc(c.id)}" data-name="${esc(c.name)}">${avatar(c)}${n ? `<span class="dot">${n > 9 ? '9+' : n}</span>` : ''}<span class="n">${esc(c.name)}</span></button>`; }).join('')}</div>` : '';
}
function renderHome(){
  renderStories();
  $('#hhist').innerHTML = hist.length ? `<h2 class="sec">Recently watched</h2><div class="strip">${hist.map(hcard).join('')}</div>` : '';
  $('#hfeed').innerHTML = saved.length ? '' : `<div class="hero">
      <h2>No channels saved yet</h2>
      <p>Save channels from search and they show up here.</p>
      <div class="sug">${['Trending music','Tech reviews','Movie trailers','F1 highlights'].map(s => `<button class="chip q" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    </div>`;
  renderHomeNext();
  if (saved.length && (homeDirty || Date.now() - homeAt > 600000)) fetchFeed();
}
/* Home "Up next": same /related endpoint as the watch page, seeded from the most recently watched video; infinite scroll via continuation token */
let hnId = null, hnVids = [], hnNext = null, hnTok = 0, hnBusy = false, hnSeen = new Set(), hnIO = null;
function paintHomeNext(){
  const v = hist[0];
  if (!hnVids.length) { $('#hnext').innerHTML = ''; return; }
  $('#hnext').innerHTML = `<h2 class="sec">Up next</h2><p class="sub" style="margin:-4px 0 8px">Because you watched ${esc(v?.title || '')}</p><div class="recs">${hnVids.map(x => rcard(x)).join('')}</div><div id="hnsent" style="min-height:1px">${hnNext ? skelRows(2) : ''}</div>`;
  watchSentinel();
}
function watchSentinel(){
  if (hnIO) hnIO.disconnect();
  const el = $('#hnsent');
  if (!el || !hnNext || !('IntersectionObserver' in window)) return;
  hnIO = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) moreHomeNext(); }, { rootMargin: '700px 0px' });
  hnIO.observe(el);
}
function addHomeNext(list){
  const fv = list.map(norm).filter(x => x.id && !hnSeen.has(x.id));
  fv.forEach(x => hnSeen.add(x.id)); remember(fv); hnVids.push(...fv);
  store.set('shelf.homenext', { id: hnId, videos: hnVids.slice(0, 60), next: hnNext });
}
async function moreHomeNext(){
  if (hnBusy || !hnNext || !hnId) return;
  if (!$('#home').classList.contains('on')) return;
  hnBusy = true; const tok = hnTok, id = hnId;
  try {
    const d = await api('/related?id=' + enc(id) + '&token=' + enc(hnNext));

function ingest(c, items, tab, id, name){

(() => {
  const w = $('#watch'), body = $('#wbody');

    y0 = e.touches[0].clientY; dy = 0; drag = false;
  };

    setTimeout(() => { w.style.transition = ''; }, 200);

/* ---------- SHORTS (full-screen vertical feed, one shared player) ---------- */
let shOpen = false, shp = null, shState = -1, shMuted = false, shAuto = null, shPending = null, shScrollT = null;

async function openShorts(src, start = 0){

/* ---------- SYNC (Cloudflare KV through the worker) ---------- */
const sy = { code: store.get('shelf.code', ''), last: store.get('shelf.last', 0), err: '' };
let pushT = null;
function touch(){
  store.set('shelf.updated', Date.now());
  clearTimeout(pushT);
  if (sy.code) pushT = setTimeout(push, 2500);
}
const docNow = () => ({ channels: saved, history: hist, playlists: plists, seen, updated: store.get('shelf.updated', Date.now()) });
async function syncFetch(method, body){
  const r = await fetch(`${API}/sync?code=${enc(sy.code)}`, {
    method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify({ doc: body }) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Sync failed');
  return d;
}
async function push(){
  if (!sy.code) return;
  try { await syncFetch('POST', docNow()); sy.last = Date.now(); store.set('shelf.last', sy.last); sy.err = ''; }
  catch (e) { sy.err = e.message; }
  renderSync();
}
const uniq = (a, b) => { const m = new Map(); [...a, ...b].forEach(x => { if (x?.id && !m.has(x.id)) m.set(x.id, x); }); return [...m.values()]; };
function adopt(doc){
  saved = doc.channels || []; hist = doc.history || []; plists = doc.playlists || []; seen = doc.seen || {};
  store.set('shelf.updated', doc.updated || Date.now()); persist(); homeDirty = true; refresh();
}
async function pull(first){

function genCode(){
  const a = 'abcdefghjkmnpqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(24));

}
function renderSync(){
  const b = $('#sbody'); if (!b) return;
  const err = sy.err ? `<p class="err">${esc(sy.err)}</p>` : '';
  b.innerHTML = !sy.code
    ? `<p class="sub">Keep channels, playlists and history in sync across your devices. Needs the worker's KV setup.</p>
       <button class="btn more" id="screate">Create sync code</button>
       <p class="sub" style="margin:4px 0 8px">Already have a code?</p>
       <form class="bar" id="sjoin"><div class="field">${ic('cloud')}<input type="text" id="scode" placeholder="Enter sync code" autocapitalize="off" autocomplete="off"></div><button class="btn" aria-label="Connect">${ic('check')}</button></form>${err}`
    : `<p class="sub">Your sync code. Enter it on your other devices and keep it private.</p>
       <div class="code">${esc(sy.code)}</div>

       <p class="sub" style="margin-bottom:10px">Last synced: ${sy.last ? new Date(sy.last).toLocaleTimeString() : 'never'}</p>${err}

$('#sopen').onclick = () => { renderSync(); $('#ssheet').hidden = false; };
document.addEventListener('submit', async e => {

});
async function syncClick(id){
  if (id === 'screate') { sy.code = genCode(); store.set('shelf.code', sy.code); sy.err = ''; touch(); await push(); }
  else if (id === 'scopy') { try { await navigator.clipboard.writeText(sy.code); toast('Code copied'); } catch { toast('Select and copy the code'); } }

const SYNC_IDS = ['screate', 'scopy', 'snow', 'sdisc'];
document.addEventListener('click', e => {
  const bid = e.target.closest('button')?.id;

  const t = e.target.closest('[data-play],[data-qi],[data-pli],[data-pl],[data-savepl],[data-delpl],[data-save],[data-open],[data-del],[data-q],[data-f],[data-seek],[data-rep],[data-cmore],[data-sh],[data-tab2],[data-shq],[data-shtap],[data-shmute]');

  else if (d.seek !== undefined) seek(+d.seek);
  else if (d.sh !== undefined) openShorts({ kind: 'channel', id: chId, name: chName }, +d.sh);
  else if (d.tab2) switchTab(d.tab2);
  else if (t.hasAttribute('data-shq')) openShorts({ kind: 'q', q: sq });

  else if (d.rep) loadReplies(t);

};
window.addEventListener('appinstalled', () => { $('#installbtn').hidden = true; toast('Installed'); });

/* launch: app shortcuts (?s=search) and Android share target (?url=...) */
function launch(){
  const p = new URLSearchParams(location.search);
  if (!location.search) return;
  const shared = (p.get('url') || '') + ' ' + (p.get('text') || '');
  const list = shared.match(/[?&]list=([\w-]{10,64})/)?.[1];
  const vid = shared.match(/(?:[?&]v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/)?.[1];
  const tab = p.get('s');
  history.replaceState(null, '', location.pathname);
  if (vid) openWatch(vid);
  else if (list) openPlaylist(list, 'Playlist');
  else if (['home', 'search', 'saved'].includes(tab)) show(tab);
  else if (shared.trim()) doSearch(shared.trim());
}

/* ---------- boot ---------- */
paintFilters(); refresh();
saved.filter(c => !c.avatar).slice(0, 4).forEach(c => fillAvatar(c.id));
pull(false);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(false); });
launch();
</script>
